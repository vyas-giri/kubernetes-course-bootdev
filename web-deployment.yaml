apiVersion: apps/v1
kind: Deployment
metadata:
  name: synergychat-web
  namespace: default
  labels:
    app: synergychat-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: synergychat-web
  template:
    metadata:
      labels:
        app: synergychat-web
    spec:
      containers:
      - name: synergychat-web
        image: docker.io/bootdotdev/synergychat-web:latest
        imagePullPolicy: Always
        resources: {}
        envFrom:
          - configMapRef:
              name: synergychat-web-configmap
